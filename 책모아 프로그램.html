:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#19344d;background:#f6f9fd;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1976d2;outline-offset:2px}.wrap{max-width:980px;margin:auto;padding:22px 18px 76px}.header{display:flex;align-items:center;justify-content:space-between;gap:10px}.logo{font-size:31px;color:#0c72b2;font-weight:900;letter-spacing:-1.4px}.logo small{font-size:12px;letter-spacing:2px;font-weight:800;margin-left:8px}.area{font-weight:750;color:#48627b;margin-top:4px}.header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.region-switch{max-width:230px;background:#fff;border:1px solid #d6e0eb;border-radius:12px;padding:10px;color:#284765;font-weight:750}@media(max-width:520px){.header{align-items:flex-start;flex-direction:column}.header-controls{width:100%;justify-content:stretch}.region-switch{flex:1;max-width:none}.member img{height:150px}}.plain{background:#fff;border:1px solid #d6e0eb;border-radius:12px;padding:10px 14px;color:#284765;font-weight:750}.hero{background:linear-gradient(120deg,#eaf5ff,#f1fbfa);padding:22px;border-radius:22px;margin:24px 0 18px}.hero h1{font-size:23px;margin:0 0 7px;letter-spacing:-.6px}.muted{color:#607589;font-size:14px;line-height:1.65}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:650px;margin:auto}.tile{border:0;border-radius:22px;aspect-ratio:1;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:8px;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 14px #1234560a}.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px #1234561a}.tile .emoji{font-size:44px;display:flex;align-items:center;justify-content:center;width:56px;height:56px;color:#24547a}.tile .emoji svg{width:56px;height:56px;display:bl th:7px;height:7px;border-radius:50%;background:#d98424}.empty{min-height:20px}.records{display:grid;gap:9px;margin:12px 0}.record{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border-radius:12px;background:#f4f8fd}.list{display:grid;gap:10px}.item{border:1px solid #e0e7ee;border-radius:13px;padding:14px;background:#fbfdff}.item h3{margin:0 0 7px;font-size:16px}.small{font-size:13px;color:#647b90}.link{display:inline-flex;align-items:center;background:#0c72b2;color:white;text-decoration:none;border-radius:12px;padding:12px 17px;font-weight:800;margin-top:8px}.modal{position:fixed;inset:0;background:#071b2dd9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.on{display:flex}.modal img{max-height:85vh;max-width:95vw;object-fit:contain}.modal button{position:absolute;right:22px;top:22px;background:white;padding:10px 15px;border:0;border-radius:12px}.rowbetween{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}footer{text-align:center;color:#8192a4;font-size:12px;margin-top:34px}.hidden{display:none!important}body.big{font-size:20px}body.big .tile strong{font-size:22px}body.big .muted{font-size:17px}@media(min-width:740px){.tiles{gap:20px}.tile .emoji{font-size:55px}.tile strong{font-size:22px}.calendar .day{min-height:75px}}
.delete-region-row{margin-top:18px;padding-top:16px;border-top:1px solid #e0e7ef;display:flex;align-items:center;flex-wrap:wrap;gap:12px}.danger:disabled{opacity:.5;cursor:not-allowed} .record .small{line-height:1.7}.folder-block{border:1px solid #d8e4f1;border-radius:15px;overflow:hidden;margin-top:12px;background:#fff}.folder-head{padding:15px;background:#edf5fc;display:flex;align-items:center;gap:12px}.folder-toggle{flex:1;text-align:left;background:transparent;border:0;color:#19344d;font-weight:850;font-size:17px;min-height:42px}.folder-count{font-size:13px;color:#56738b}.folder-content{padding:13px;display:grid;gap:10px}.folder-actions{display:flex;gap:7px;flex-wrap:wrap}.folder-actions button{font-size:13px}.library-entry{padding:13px;border:1px solid #e0e8f0;border-radius:12px;background:#fbfdff}.library-entry h3{margin:0 0 7px;font-size:16px}.library-entry .actions{margin-top:10px}.library-entry a{display:inline-flex;align-items:center;padding:10px 13px;background:#0c72b2;color:white;border-radius:10px;text-decoration:none;font-weight:750}.return-form{margin-top:11px;padding:14px;border:1px solid #d9e4ee;border-radius:12px;background:#f7fbff}.return-form .formrow{margin-top:12px}.return-form h3{margin:0 0 12px;font-size:16px}.return-empty{padding:13px;color:#657c90}.folder-block summary{cursor:pointer}</style></head><body><main class="wrap"><header class="header"><div><div class="logo">책모아 <small>BOOKMOA</small></div><div class="area" id="areaText">군산 · 구리구리</div></div><div class="header-controls"><select class="region-switch" id="headerRegionSelect" aria-label="지역 변경" onchange="changeRegion(this.value)"></select><button class="plain" onclick="openSettings()">⚙ 지역 설정</button></div></header><section id="home"><div class="hero"><h1>어떤 도서 서비스를 이용할까요?</h1><div class="muted">필요한 서비스를 선택해 주세요. 로그인 없이 이용할 수 있어요.</div></div><div class="tiles" id="tiles"></div></section><section id="page" class="hidden"></section><footer>BOOKMOA · 지역 맞춤형 도서정보서비스 시제품<br>실제 기관의 회원증 사용 및 참여 여부는 해당 기관 안내를 확인해 주세요.</footer></main><div class="modal" id="zoom" onclick="this.classList.remove('on')"><button aria-label="닫기">✕ 닫기</button><img id="zoomImg" alt="등록한 회원증 크게 보기"></div><script>
const SKEY='bookmoa_recreated_v2';let state;try{state=JSON.parse(localStorage.getItem(SKEY))||{}}catch{state={}};state.regions??=[{id:'gunsan',region:'군산',nickname:'구리구리'}];state.active??='gunsan';state.cards??=[];state.records??=[];state.booksellers??=[];state.returns??=[];state.returnFolders??=[];state.sellerFolders??=[];state.big??=false;const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');let section='home', month=new Date(), selectedDate=ymd(new Date());if(state.big)document.body.classList.add('big');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(state))}catch(e){alert('저장 공간이 부족합니다. 회원증 이미지를 더 작게 줄여 등록해 주세요.')}};const region=()=>state.regions.find(r=>r.id===state.active)||state.regions[0];const currentCards=()=>state.cards.filter(c=>c.regionId===state.active);const currentRecords=()=>state.records.filter(c=>c.regionId===state.active);function route(name){section=name;render();window.scrollTo(0,0)}function render(){document.getElementById('areaText').textContent=region().region+' · '+region().nickname;document.getElementById('headerRegionSelect').innerHTML=state.regions.map(r=>`<option value="${esc(r.id)}" ${r.id===state.active?'selected':''}>${esc(r.region)} - ${esc(r.nickname)}</option>`).join('');document.getElementById('home').classList.toggle('hidden',section!=='home');let page=document.getElementById('page');page.classList.toggle('hidden',section==='home');if(section==='home')return;page.innerHTML='<div class="toprow"><button class="back" onclick="route(\'home\')">← 처음으로</button></div>'+({cards:renderCards,calendar:renderCalendar,returns:renderReturns,sellers:renderSellers,sea:()=>renderInfo('sea'),delivery:()=>renderInfo('delivery'),settings:renderSettings}[section]||(()=>''))();if(section==='returns')renderReturnsList();}let tileData=[['cards','💳','회원증 통합보관','내 회원증 모아보기','#e0efff'],['calendar','📅','도서대출·반납','반납 일정 확인','#e4f6ed'],['returns','🏛️','타관반납 도서관','다른 반납 장소 찾기','#f0e8ff'],['sellers','🏪','바로대출 서점','참여서점 찾기','#fff0df'],['sea','📚','책바다','다른 도서관 책 빌리기','#e1f4f7'],['delivery','🚚','책나래','집으로 책 배달받기','#fbe8ec']];document.getElementById('tiles').innerHTML=tileData.map(([id,ico,name,sub,bg])=>`<button class="tile" style="--bg:${bg}" onclick="route('${id}')"><span class="emoji" aria-hidden="true">${ico}</span><strong>${name}</strong><span>${sub}</span></button>`).join('');function heading(t,sub=''){return `<h2 class="h2">${t}</h2><div class="muted">${sub}</div>`}
function renderCards(){let c=currentCards();return heading('회원증 통합보관','스크린샷 이미지를 등록하고 도서관 이름을 붙여 보관하세요.')+`<div class="notice">회원증은 이 브라우저에 저장됩니다. 공용 기기에서는 실제 회원증 등록을 피하고, 브라우저 데이터를 삭제하면 사라질 수 있습니다.</div><div class="pane"><div class="formrow"><div class="field"><label for="cardName">도서관 이름</label><input id="cardName" placeholder="예: 군산시립도서관" maxlength="40"></div><div class="field"><label for="cardImage">회원증 스크린샷</label><input id="cardImage" type="file" accept="image/*"></div><button class="primary" onclick="addCard()">＋ 회원증 등록</button></div></div><div class="cards">${c.length?c.map(x=>`<article class="member"><img src="${x.img}" alt="${esc(x.name)} 회원증 이미지" onclick="zoomCard('${x.id}')"><div class="rowbetween"><div class="name">${esc(x.name)}</div><span>${x.star?'⭐':''}</span></div><div class="actions"><button onclick="zoomCard('${x.id}')">크게 보기</button><button onclick="editCard('${x.id}')">이름 수정</button><button onclick="toggleStar('${x.id}')">${x.star?'즐겨찾기 해제':'☆ 즐겨찾기'}</button><button onclick="replaceCard('${x.id}')">교체</button><button onclick="deleteCard('${x.id}')">삭제</button></div></article>`).join(''):'<p class="muted">저장된 회원증이 없습니다. 위에서 첫 회원증을 등록해 주세요.</p>'}</div>`}
function getCard(id){return state.cards.find(x=>x.id===id&&x.regionId===state.active)}function zoomCard(id){let c=getCard(id);if(!c)return;document.getElementById('zoomImg').src=c.img;document.getElementById('zoom').classList.add('on')}function readImage(file,cb){if(!file)return alert('이미지를 선택해 주세요.');if(file.size>8*1024*1024)return alert('8MB 이하 이미지를 사용해 주세요.');let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=1200,scale=Math.min(1,max/Math.max(img.width,img.height));let canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.83))};img.src=reader.result};reader.readAsDataURL(file)}function addCard(){let name=document.getElementById('cardName').value.trim(),file=document.getElementById('cardImage').files[0];if(!name)return alert('도서관 이름을 입력해 주세요.');readImage(file,img=>{state.cards.push({id:crypto.randomUUID(),regionId:state.active,name,img,star:false});save();render()})}function editCard(id){let c=getCard(id);if(!c)return;let name=prompt('수정할 도서관 이름',c.name);if(name?.trim()){c.name=name.trim().slice(0,40);save();render()}}function toggleStar(id){let c=getCard(id);if(c){c.star=!c.star;state.cards.sort((a,b)=>Number(b.star)-Number(a.star));save();render()}}function deleteCard(id){if(confirm('이 회원증을 삭제할까요?')){state.cards=state.cards.filter(c=>c.id!==id);save();render()}}function replaceCard(id){let c=getCard(id);if(!c)return;let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>readImage(inp.files[0],img=>{c.img=img;save();render()});inp.click()}
function renderCalendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let dayCells=Array(first).fill('<div class="empty"></div>').join('')+Array.from({length:count},(_,i)=>{let d=ymd(new Date(y,m,i+1));return `<button class="day ${selectedDate===d?'sel':''}" onclick="chooseDate('${d}')">${i+1}${currentRecords().some(r=>r.date===d)?'<em></em>':''}</button>`}).join('');let rec=currentRecords().filter(x=>x.date===selectedDate);let total=rec.reduce((a,b)=>a+(Number(b.count)||0),0);let today=ymd(new Date());return heading('도서대출·반납 달력','도서관 이름·대출 권수·대출기간·메모를 입력하면 반납일이 자동 계산됩니다.')+`<div class="pane"><div class="datebar"><button class="plain" onclick="changeMonth(-1)">〈 이전</button><strong>${y}년 ${m+1}월</strong><button class="plain" onclick="changeMonth(1)">다음 〉</button></div><div class="calendar">${['일','월','화','수','목','금','토'].map(x=>`<div class="dow">${x}</div>`).join('')}${dayCells}</div><div class="notice"><b>${esc(selectedDate)}</b> · 반납할 책 <b>${total}권</b></div><div class="records">${rec.length?rec.map(r=>`<div class="record"><span><b>${esc(r.library)}</b><br><span class="small">${r.count}권 · ${r.loanDate?`대출일 ${esc(r.loanDate)} · `:''}${r.period?`${r.period}일 대출 · `:''}${esc(r.memo||'반납 예정')}</span></span><button class="danger" onclick="deleteRecord('${r.id}')">삭제</button></div>`).join(''):'<p class="muted">이 날짜에 등록된 반납 일정이 없습니다.</p>'}</div></div><div class="pane"><h3 style="margin-top:0">＋ 대출 정보 등록</h3><div class="formrow"><div class="field"><label for="recordLib">도서관 이름</label><input id="recordLib" placeholder="예: 중앙도서관"></div><div class="field"><label for="recordCount">대출 권수</label><input id="recordCount" type="number" min="1" max="999" value="1"></div><div class="field"><label for="recordLoanDate">대출일</label><input id="recordLoanDate" type="date" value="${today}" onchange="updateDuePreview()"></div><div class="field"><label for="recordPeriod">대출기간 (일)</label><input id="recordPeriod" type="number" min="1" max="3650" step="1" value="14" placeholder="예: 14" oninput="updateDuePreview()"></div><div class="field"><label for="recordMemo">메모 (선택)</label><input id="recordMemo" placeholder="예: 읽을 책 2권"></div></div><div class="notice" id="duePreview" aria-live="polite"></div><button class="primary" onclick="addRecord()">＋ 반납 일정 자동 등록</button><p><button class="plain" onclick="exportICS()">📱 스마트폰 달력에 추가(.ics)</button></p><div class="small">대출일로부터 입력한 일수가 지난 날짜에 반납 일정이 등록됩니다. 예를 들어 11월 19일에 대출하고 14일을 입력하면 12월 3일에 등록됩니다. .ics 파일을 휴대폰 달력에 가져올 수 있으며 자동 동기화는 되지 않습니다.</div></div>`}
function calculateDueDate(loanDate,period){if(!/^\d{4}-\d{2}-\d{2}$/.test(loanDate)||!Number.isInteger(period)||period<1||period>3650)return null;let [year,mon,day]=loanDate.split('-').map(Number);let d=new Date(year,mon-1,day,12);if(d.getFullYear()!==year||d.getMonth()!==mon-1||d.getDate()!==day)return null;d.setDate(d.getDate()+period);return ymd(d)}
function updateDuePreview(){let loanDate=document.getElementById('recordLoanDate')?.value||'',period=Number(document.getElementById('recordPeriod')?.value),due=calculateDueDate(loanDate,period),el=document.getElementById('duePreview');if(el)el.innerHTML=due?`📅 반납 예정일: <b>${esc(due)}</b> (대출일 + ${period}일)`:'대출일과 1~3650 사이의 대출기간을 입력해 주세요.'}
function chooseDate(d){selectedDate=d;render()}function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);selectedDate=ymd(month);render()}function addRecord(){let library=document.getElementById('recordLib').value.trim(),count=Number(document.getElementById('recordCount').value),memo=document.getElementById('recordMemo').value.trim(),loanDate=document.getElementById('recordLoanDate').value,period=Number(document.getElementById('recordPeriod').value),due=calculateDueDate(loanDate,period);if(!library||!Number.isInteger(count)||count<1||count>999)return alert('도서관 이름과 올바른 대출 권수를 입력해 주세요.');if(!due)return alert('대출일과 올바른 대출기간(1~3650일)을 입력해 주세요.');state.records.push({id:crypto.randomUUID(),regionId:state.active,library,count,memo,loanDate,period,date:due});month=new Date(due+'T12:00:00');selectedDate=due;save();render()}
function deleteRecord(id){state.records=state.records.filter(r=>r.id!==id);save();render()}function exportICS(){let rows=currentRecords();if(!rows.length)return alert('먼저 반납 일정을 등록해 주세요.');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//BOOKMOA//RETURN CALENDAR//KO'];for(let r of rows){let d=r.date.replaceAll('-',''),end=ymd(new Date(new Date(r.date+'T12:00:00').getTime()+86400000)).replaceAll('-','');let clean=s=>String(s).replace(/[\\;,\n]/g,' ');lines.push('BEGIN:VEVENT','UID:'+r.id+'@bookmoa','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'') ,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+clean('도서 반납: '+r.library+' '+r.count+'권'),'DESCRIPTION:'+clean(r.memo),'END:VEVENT')}lines.push('END:VCALENDAR');let blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='책모아_반납일정.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function returnFolders(){return state.returnFolders.filter(f=>f.regionId===state.active)}

).value.trim(),b=document.getElementById('regionNickname').value.trim();if(!a||!b)return alert('지역 이름과 페이지 이름을 입력해 주세요.');Object.assign(region(),{region:a,nickname:b});save();render()}function addRegion(){let a=document.getElementById('newRegion').value.trim(),b=document.getElementById('newNickname').value.trim();if(!a||!b)return alert('지역 이름과 페이지 이름을 입력해 주세요.');let id=crypto.randomUUID();state.regions.push({id,region:a,nickname:b});state.active=id;save();render()}function deleteRegion(){if(state.regions.length<=1)return alert('마지막 지역은 삭제할 수 없습니다. 다른 지역을 먼저 추가해 주세요.');let target=region(),id=target.id,name=target.region+' - '+target.nickname;if(!confirm('정말 "'+name+'" 지역을 삭제할까요?\n이 지역의 회원증 이미지, 대출·반납 일정, 타관반납 도서관, 참여서점 정보가 모두 삭제됩니다.\n삭제 후 복구할 수 없습니다.'))return;state.regions=state.regions.filter(r=>r.id!==id);state.cards=state.cards.filter(x=>x.regionId!==id);state.records=state.records.filter(x=>x.regionId!==id);state.returns=state.returns.filter(x=>x.regionId!==id);state.returnFolders=state.returnFolders.filter(x=>x.regionId!==id);state.booksellers=state.booksellers.filter(x=>x.regionId!==id);state.sellerFolders=state.sellerFolders.filter(x=>x.regionId!==id);state.active=state.regions[0].id;section='home';month=new Date();selectedDate=ymd(new Date());userCoords=null;save();render();window.scrollTo(0,0)}

function seedGunsanSmallLibraries(){
 state.librarySeedVersions??={};
 const gs=state.regions.find(r=>r.id==='gunsan')||state.regions.find(r=>r.region==='군산');
 if(!gs||state.librarySeedVersions[gs.id]>=1)return;
 let folder=state.returnFolders.find(f=>f.regionId===gs.id&&f.name==='군산시');
 if(!folder){folder={id:crypto.randomUUID(),regionId:gs.id,name:'군산시'};state.returnFolders.push(folder)}
 for(const [name,address] of gunsanSmallLibraries){
  if(!state.returns.some(x=>x.regionId===gs.id&&x.name===name)){
   state.returns.push({id:crypto.randomUUID(),regionId:gs.id,folderId:folder.id,name,address,note:''});
  }
 }
 state.librarySeedVersions[gs.id]=1;
 save();
}
seedGunsanSmallLibraries();
